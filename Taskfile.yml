# The gate. There is no CI (#149): this is the whole check, and it runs only
# when someone runs it, so a check left out of it is not run anywhere.
#
# The toolchain is deliberately unpinned. The gate is meant to fail when a
# tool moves rather than drift behind it, so a red gate on code you did not
# touch is the signal working. Answer the finding; do not pin a tool or add
# a linter disable to silence it.
version: "3"

tasks:
  default:
    desc: The whole gate, in the order a failure is cheapest to read
    cmds:
      - task: tidy
      - task: lint
      - task: nilaway
      - task: vuln
      - task: test
      - task: docs

  setup:
    desc: Install every tool the gate runs - the Brewfile's, and NilAway, which has no formula
    cmds:
      - brew bundle --file=Brewfile
      - go install go.uber.org/nilaway/cmd/nilaway@latest

  tidy:
    desc: go.mod and go.sum are current
    cmds:
      - go mod tidy -diff

  lint:
    desc: golangci-lint, which also reports any formatting difference and runs every go vet analyzer
    cmds:
      # First, because a malformed .golangci.yml otherwise surfaces as a
      # runtime linter error rather than a config error -- an invalid
      # setting reads as "the linter is broken" and costs a round trip to
      # place. `default: all` means this config carries real settings for a
      # dozen linters, so it is the likeliest breakage.
      - golangci-lint config verify
      - golangci-lint run ./...

  fix:
    desc: Apply every autofix the enabled formatters and linters offer
    # Not part of the gate: `lint` already reports everything this repairs.
    #
    # Read the diff before committing it. Two of these fixers have rewritten
    # this repository incorrectly: godot appended a period after a closing
    # quotation mark in eleven doc comments, and dupword deleted a word from
    # a verbatim quotation of Book 1 p. 3. Both are configured off that
    # behaviour now, but an autofix on a codebase that quotes a primary
    # source is not a safe blind operation.
    cmds:
      - golangci-lint run ./... --fix

  nilaway:
    desc: Flow-sensitive nil-dereference analysis with NilAway
    cmds:
      - nilaway ./...

  vuln:
    desc: Known vulnerabilities in the code this module actually calls, from govulncheck
    cmds:
      - govulncheck ./...

  test:
    desc: The suite, with the race detector
    cmds:
      - go test -race ./...

  docs:
    desc: Markdown, JSON and YAML are formatted, and no link points at nothing
    # `bun fmt` is to every non-Go file what gofumpt is to the Go files. It
    # runs in --check here because the gate reports rather than repairs;
    # `task docs:fix` is the writer.
    #
    # lychee checks every tracked Markdown file's links to files and anchors
    # in this tree, offline: a document moved or deleted is found here rather
    # than by a reader. Links to the web are not followed, so the gate needs
    # no network and a site going down never turns it red.
    cmds:
      - bun fmt --check
      - git ls-files -z '*.md' | xargs -0 lychee --offline --include-fragments --no-progress

  docs:fix:
    desc: Format Markdown, JSON and YAML with bun fmt
    cmds:
      - bun fmt
